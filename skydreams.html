<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>Skydreams</title>
    <style>
        @font-face {
            font-family: 'PressStart2P';
            src: url('PressStart2P.ttf') format('truetype');
        }
        body {
            font-family: 'PressStart2P', monospace;
        }
    </style>
</head>
<body>
<script>
/*
SKYDREAMS 🌈 A 3D 1K FEVER DREAM
COPYRIGHT 2026 ☁️ KILLED BY A PIXEL
Made by Frank Force for JS1024 2026
https://js1024.fun/demos/2026/25/readme

An endless race in the sky inspired by 90's 3D games like sky roads, marble madness, and Sonic 3d. My goal was to create a dreamlike experience with full resolution full speed graphics that would be easy to pick up and play.

Features
- 3D rendering system
- procedurally generated levels
- level increases in difficulty over time
- 3D player sphere with shadow
- mouse controls
- colorful sky with stars
*/
'use strict';

// js1024 shim
const a = document.createElement('canvas');
const c = a.getContext("2d");
document.body.appendChild(a);
document.body.style='margin:0;overflow:hidden;background:#000';
a.width = innerWidth;
a.height = innerHeight;
const TOP_SCORE_COUNT = 5;

const deathOverlay = document.createElement('div');
deathOverlay.style = 'position:fixed;inset:0;display:grid;place-items:center;align-content:center;gap:14px;margin:0;color:#fff;font:18px/1.2 PressStart2P,monospace;text-align:center;pointer-events:auto;text-shadow:0 0 8px #fff';
document.body.appendChild(deathOverlay);
const deathStats = document.createElement('div');
deathStats.style = 'display:block;max-width:90vw;padding:8px 12px;background:#000;line-height:1.8;white-space:pre-line';
deathOverlay.appendChild(deathStats);
const leaderboardTitle = document.createElement('div');
leaderboardTitle.style = 'padding:8px 12px;background:#000';
leaderboardTitle.textContent = `TOP ${TOP_SCORE_COUNT}`;
deathOverlay.appendChild(leaderboardTitle);
const leaderboardList = document.createElement('div');
leaderboardList.style = 'min-width:min(90vw,420px);padding:10px 14px;background:#000;text-align:left;white-space:pre;line-height:1.7;font-size:clamp(11px,2.2vw,18px)';
deathOverlay.appendChild(leaderboardList);
const namePrompt = document.createElement('div');
namePrompt.style = 'display:none;padding:8px 12px;background:#000;line-height:1.7';
deathOverlay.appendChild(namePrompt);
const namePromptText = document.createElement('div');
namePromptText.textContent = 'NEW HIGH SCORE - ENTER NAME';
namePrompt.appendChild(namePromptText);
const nameInput = document.createElement('input');
nameInput.maxLength = 10;
nameInput.placeholder = 'USERNAME';
nameInput.autocomplete = 'nickname';
nameInput.style = 'width:min(70vw,240px);padding:8px;border:2px solid #fff;background:#000;color:#fff;font:16px PressStart2P,monospace;text-transform:uppercase';
namePrompt.appendChild(nameInput);
const nameButton = document.createElement('button');
nameButton.textContent = 'SUBMIT';
nameButton.style = 'margin-left:8px;padding:8px;border:2px solid #fff;background:#fff;color:#000;font:14px PressStart2P,monospace;cursor:pointer';
namePrompt.appendChild(nameButton);
const deathBanner = document.createElement('img');
deathBanner.style = 'display:none;max-width:80vw;max-height:70vh;object-fit:contain';
deathBanner.alt = 'Game over ASCII art';
deathOverlay.appendChild(deathBanner);
const deathPrompt = document.createElement('div');
deathPrompt.style = 'padding:8px 12px;background:#000';
deathPrompt.textContent = 'PRESS TO START';
deathOverlay.appendChild(deathPrompt);
const initialBannerNumber = (Math.random()*25|0) + 1;
deathBanner.src = encodeURI(`banners/ascii-art (${initialBannerNumber}).png`);
deathBanner.style.display = 'block';

////////////////////////////////////////////////

const ENHANCED = 1;      // keyboard and touch input
const test = 0;          // test stuff
const cameraInFront = 3; // camera distance
const F = .7;            // focal length

// Paste the values from your JSONBin account here.
const JSONBIN_BIN_ID = '6aa97645ffd5d160530acf74';
const JSONBIN_ACCESS_KEY = '$2a$10$/ixw5jkkHC.ZGSRfFRuDKui80wjbSFtxiGyA2mgw2L.58/CHwNsVK';
const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;

// locals (remove from minified)
let i, j, r, p, s, px, py;
let ax, ay, bx, by, ex, ey, fx, fy;
let mouseJustPressed, mouseMode, keyInput;

// game variables
let x=0, y=0, z=0, vy=0; // ship
let score = 0;
let scoreTime = 0;
let highScore = Number(localStorage.getItem('skydreamsHighScore')) || 0;
let leaderboard = [];
let gameStarted = 0;
let pendingScore = 0;
let scoreNeedsName = 0;
let leaderboardLoading = 0;

const jsonBinReady = () =>
    JSONBIN_BIN_ID !== 'YOUR_BIN_ID' && JSONBIN_ACCESS_KEY !== 'YOUR_X_MASTER_KEY';

const renderLeaderboard = () =>
{
    leaderboardList.textContent = leaderboard.length
        ? leaderboard.map((entry, index) => `${String(index + 1).padStart(2, ' ')}  ${entry.name.padEnd(10, ' ')} ${String(entry.score).padStart(6, ' ')}`).join('\n')
        : 'NO SCORES YET';
};

const loadLeaderboard = async () =>
{
    if (!jsonBinReady())
    {
        leaderboardList.textContent = 'ADD JSONBIN SETTINGS';
        return;
    }
    try
    {
        const response = await fetch(`${JSONBIN_URL}/latest`, {headers:{'X-Master-Key':JSONBIN_ACCESS_KEY}});
        if (!response.ok) throw Error(`HTTP ${response.status}`);
        const data = await response.json();
        leaderboard = (Array.isArray(data.record.scores) ? data.record.scores : [])
            .filter(entry => entry && typeof entry.name === 'string' && Number.isFinite(Number(entry.score)))
            .map(entry => ({name: entry.name.slice(0, 10), score: Number(entry.score)}))
            .sort((left, right) => right.score - left.score)
            .slice(0, TOP_SCORE_COUNT);
        renderLeaderboard();
    }
    catch (error)
    {
        leaderboardList.textContent = 'LEADERBOARD OFFLINE';
        console.warn('JSONBin leaderboard unavailable:', error);
    }
};

const qualifies = score => leaderboard.length < TOP_SCORE_COUNT || score >= leaderboard[leaderboard.length - 1].score;

const submitScore = async () =>
{
    if (!scoreNeedsName) return;
    const name = nameInput.value.trim().slice(0, 10).toUpperCase();
    if (!name) return;
    nameButton.disabled = true;
    try
    {
        leaderboard.push({name, score: pendingScore});
        leaderboard.sort((left, right) => right.score - left.score);
        leaderboard = leaderboard.slice(0, TOP_SCORE_COUNT);
        const response = await fetch(JSONBIN_URL, {
            method: 'PUT',
            headers: {'Content-Type':'application/json', 'X-Master-Key':JSONBIN_ACCESS_KEY},
            body: JSON.stringify({scores: leaderboard})
        });
        if (!response.ok) throw Error(`HTTP ${response.status}`);
        scoreNeedsName = 0;
        namePrompt.style.display = 'none';
        deathPrompt.textContent = 'PRESS TO RESTART';
        renderLeaderboard();
    }
    catch (error)
    {
        leaderboard = leaderboard.filter(entry => entry.name !== name || entry.score !== pendingScore);
        nameButton.disabled = false;
        namePromptText.textContent = 'UPLOAD FAILED - TRY AGAIN';
        console.warn('JSONBin leaderboard update failed:', error);
    }
};

nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') submitScore(); });
nameButton.onclick = submitScore;

const resetGame = () =>
{
    x = y = z = vy = trackGap = score = scoreTime = 0;
    trackSx = trackSw = 3;
    trackRows = [];
    dead = 0;
    gameStarted = 1;
    scoreNeedsName = 0;
    leaderboardLoading = 0;
    nameButton.disabled = false;
    namePrompt.style.display = 'none';
    deathBanner.style.display = 'none';
    deathPrompt.textContent = 'PRESS TO RESTART';
    deathOverlay.style.display = 'none';
};

const showDeathScreen = async () =>
{
    pendingScore = score;
    leaderboardLoading = 1;
    deathStats.textContent = `SCORE ${score}  HIGHSCORE ${highScore}`;
    const bannerNumber = (Math.random()*25|0) + 1;
    deathBanner.src = encodeURI(`banners/ascii-art (${bannerNumber}).png`);
    deathBanner.style.display = 'block';
    deathPrompt.textContent = 'LOADING LEADERBOARD';
    deathOverlay.style.display = 'grid';
    await loadLeaderboard();
    leaderboardLoading = 0;
    scoreNeedsName = jsonBinReady() && qualifies(pendingScore);
    if (scoreNeedsName)
    {
        namePromptText.textContent = 'NEW HIGH SCORE - ENTER NAME';
        namePrompt.style.display = 'block';
        nameInput.value = '';
        nameInput.focus();
        deathPrompt.textContent = 'SUBMIT NAME TO RESTART';
    }
    else
        deathPrompt.textContent = 'PRESS TO RESTART';
};

deathOverlay.onclick = e =>
{
    if (e.target === nameInput || e.target === nameButton) return;
    if (!gameStarted && !dead) resetGame();
    else if (dead && !scoreNeedsName) resetGame();
};

renderLeaderboard();
loadLeaderboard();
let trackGap = 0;        // track gap
let mouseDown = 0;       // mouse jump
let dead = 0;             // death screen state
let trackSx = 3;         // track side
let trackSw = 3;         // track width
let mouseX = a.width/2;  // mouse
let trackRows = [];      // track

// set draw color
let hsl = (h, s, l, a=1)=> 
    c.fillStyle = `hsl(${h},${s}%,${l}%,${a})`;

// project point to screen
let P = (px, py, dz) =>
    [a.width/2 + 
    (px-x+(dz-cameraInFront)**2/50*Math.cos((z+dz)/49))*a.height*F/dz,
    a.height/2 - (py-2+dz*dz/50)*a.height*F/dz, a.height*F/dz];

// main loop
let update = () =>
{
    if (!gameStarted)
        return;

    // background
    for(i=500; i--;)
    {
        // sky
        hsl(170+i/9+z, 70, 70-i/9);
        c.fillRect(0, a.height*i/500, a.width, a.height/250);
        
        // stars
        hsl(0, 0, 99);
        c.fillRect((i*i + z*i/99)%a.width, i**3.3%a.height, i%4*a.height/500, i%4*a.height/500);
    }

    // track, far to near
    for (r = z+40|0; r > z; r--)
    {
        // create new track rows if needed
        for (i = trackRows.length; i <= r; )
        {
            // randomize new segment
            if (trackGap < -8 & Math.random() < Math.min(.2,i/1e4))
            {
                // sometimes a gap
                trackGap = 2 + Math.min(4, i/400);
            }
            if (Math.random() < .1)
            {
                // new span width 2-4
                trackSw = 2 + Math.random()*3|0;
                //trackSx = Math.random()*(8-trackSw)|0;
                trackSx = Math.max(0, Math.min(7-trackSw, trackSx - 2 + Math.random()*5|0));
            }
            trackGap--;

            // create the row
            trackRows[i++] = p = [];
            for (j = 7; j--;)
            {
                p[j] = i < 35 // start area
                    | Math.random() > .9 // pillar
                    | trackGap < 0 // gap
                    & trackSx <= j & j < trackSx + trackSw // track
                    & Math.random() > Math.min(.2,z/1e4); // holes
            }
        }
        // draw the track row
        for (j = 2; j--;)
        for (i = 7; i--;)
        {
            if (trackRows[r][i])
            {
                // calculate grid points
                [ax, ay] = P(i-3.5, 0, r-z);
                [bx, by] = P(i-2.5, 0, r-z);
                [ex, ey] = P(i-3.5, 0, r-z+1);
                [fx, fy] = P(i-2.5, 0, r-z+1);

                // draw the track tile
                if (j)
                {
                    // back and sides
                    hsl(99+(r>>7)*70, 60, 30+(r+i&1)*9);
                    c.fillRect(ex,ey,fx-ex,(40-r+z)/30*a.height);
                }
                else
                {
                    // front
                    hsl(99+(r>>7)*70, 60, 9+(r+i&1)*5);
                    c.fillRect(ax,ay,bx-ax,(40-r+z)/30*a.height);

                    // top
                    hsl(99+(r>>7)*70, 60, 60+(r+i&1)*30);
                    //if (test && ((r|0)==(z+cameraInFront|0)) && i==(Math.round(x)+3|0)) hsl(0,99,50)
                    c.lineTo(ax, ay); c.lineTo(bx, by);
                    c.lineTo(fx, fy); c.lineTo(ex, ey); 
                    c.beginPath(c.fill());
                }
            }
        }
    }

    // draw player
    if (y >= 0 & trackRows[z+cameraInFront|0][Math.round(x+3)])
    {
        // draw player shadow
        hsl(0, 0, 0, .5);
        [px, py, s] = P(x, 0, cameraInFront);
        c.ellipse(px, py, s/4, s/9, 0, 0, 9);
        c.beginPath(c.fill());
    }
    for (i = 99; i--;)
    {
        // draw player
        hsl(z/9-i/3, 90, 99-i*.7);
        [px, py, s] = P(x+.1-i/1e3, y+.35-i/1e3, cameraInFront);
        c.ellipse(px, py, i*s/300, i*s/300, 0, 0, 9);
        c.beginPath(c.fill());
    }

    // update player
    if (y > -4)
    {
        // update physics
        if (ENHANCED)
        {
            if (mouseMode)
                x += mouseX/a.width/2 - .25;
            else
            {
                // keyboard controls
                if (keyInput['d'] || keyInput['ArrowRight'])
                    x += .1;
                if (keyInput['a'] || keyInput['ArrowLeft'])
                    x -= .1;
            }
        }
        else
            x += mouseX/a.width/2 - .25;
        y += vy -= .006;

        // ramp up speed
        z += Math.min(.5, .2 + z/5e3);
        scoreTime += 1 / 60;
        if (scoreTime >= .5)
        {
            score++;
            scoreTime -= .5;
        }
        if (test) z += .5

        // check if close enough to land
        if (y < 0 & y > -.3 & 
            trackRows[z+cameraInFront|0][Math.round(x+3)])
        {
            // land and jump
            y = vy = mouseDown;
            if (ENHANCED && window.ontouchstart !== undefined)
                mouseDown = 0; // touch jump
        }
        if (test && y < 0 & vy < 0)
            y = vy = 0;
    }
    else if (ENHANCED)
    {
        if (!dead)
        {
            dead = 1;
            highScore = Math.max(highScore, score);
            localStorage.setItem('skydreamsHighScore', highScore);
            showDeathScreen();
        }
        if (mouseJustPressed)
        {
            if (!scoreNeedsName && !leaderboardLoading)
                resetGame();
        }
    }

    if (ENHANCED)
        mouseJustPressed = 0;

    // hud
    c.font = `${Math.max(14, a.height/35)}px PressStart2P, monospace`;
    hsl(0, 0, 99);
    c.fillText(`SCORE ${score}`, 18, Math.max(32, a.height/16));
    if (test)
    {
        c.font = '56px PressStart2P, monospace';
        for(i=9;i--;)
        {
            hsl(0, 99, i?50:100);
            c.fillText((z|0), 9+ i, 62+i);
        }
    }
}

// mouse controls
onmousemove = e => mouseX = e.x;
onmousedown = e => mouseDown = .1;
onmouseup   = e => mouseDown = 0;

if (!ENHANCED)
    setInterval(update, 16); // 60 fps update
else
{
    // enhanced rendering system for smoother frame rate
    let frameTimeLastMS = 0, frameTimeBufferMS=0;
    const updateAnimation = (frameTimeMS=0)=>
    {
        requestAnimationFrame(updateAnimation);
        
        // update time keeping
        let frameTimeDeltaMS = frameTimeMS - frameTimeLastMS;
        frameTimeLastMS = frameTimeMS;
        frameTimeBufferMS += frameTimeDeltaMS;
        frameTimeBufferMS = Math.min(frameTimeBufferMS, 50);

        // apply time delta smoothing, improves smoothness of framerate in some browsers
        let deltaSmooth = 0;
        if (frameTimeBufferMS < 0 && frameTimeBufferMS > -9)
        {
            // force an update each frame if time is close enough (not just a fast refresh rate)
            deltaSmooth = frameTimeBufferMS;
            frameTimeBufferMS = 0;
        }
        
        // update multiple frames if necessary in case of slow framerate
        for (;frameTimeBufferMS >= 0; frameTimeBufferMS -= 1e3 / 60)
            update();

        // add the time smoothing back in
        frameTimeBufferMS += deltaSmooth;
    }

    mouseMode = 1;
    keyInput = [];
    onmousemove = e => mouseX = e.clientX;
    onmousedown = e =>
    {
        mouseDown = .1; 
        mouseJustPressed = 1;
        mouseMode = 1;
    }

    onkeydown = e=>
    {
        mouseMode = 0;
        keyInput[e.key] = 1;
        if (!gameStarted && !dead && ['w', 'a', 's', 'd', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key))
            resetGame();
        if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w')
        {
            mouseDown = .1; 
            mouseJustPressed = 1;
        }
    }
    onkeyup = e=>
    {
        keyInput[e.key] = 0;
        if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w')
        {
            mouseDown = 0; 
        }
    }

    onresize = e=>
    {
        a.width = innerWidth;
        a.height = innerHeight;
    }

    // touch support
    if (window.ontouchstart !== undefined)
    {
        // disable mobile text selection, long-press callout/magnifier, and touch gestures
        for (const el of [document.documentElement, document.body, a])
        {
            el.style.userSelect = el.style.webkitUserSelect = 'none';
            el.style.webkitTouchCallout = 'none';
            el.style.touchAction = 'none';
        }

        // simulate mouse down on touch start
        ontouchstart = e=> { e.preventDefault(); onmouseup(); };
        ontouchend = e=> { e.preventDefault(); onmousedown(); };
        ontouchmove = e=>
        {
            e.preventDefault();
            // simulate mouse move on touch move
            for (const touch of e.touches)
                onmousemove({ clientX: touch.clientX, clientY: touch.clientY });
        }
    }
    
    updateAnimation();
}
</script>
</body>
</html>
